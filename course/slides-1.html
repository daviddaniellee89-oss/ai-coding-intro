<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>심화 1회차 슬라이드</title>
<style>
:root{--bg:#faf6ee;--ink:#2b2118;--sub:#6b5d50;--line:#e6dccb;--accent:#a8481f;--accent-ink:#fff;--panel:#fff;--hi:#fff2d6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1713;--ink:#f1e8da;--sub:#b9ab99;--line:#3a3128;--accent:#e08a5c;--accent-ink:#1b1713;--panel:#26201a;--hi:#3a3020}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#stage{height:100%;display:flex;flex-direction:column}
#slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4vh 8vw;overflow:auto}
.part{font-size:clamp(14px,1.8vw,22px);color:var(--accent);font-weight:700;margin-bottom:1.2vh}
h1{margin:0 0 3vh;font-size:clamp(30px,5.4vw,72px);line-height:1.25}
.big{font-size:clamp(22px,3.8vw,52px);line-height:1.5;font-weight:700}
.cam{margin-top:2.5vh;display:inline-block;padding:.6em 1em;border:2px dashed var(--line);border-radius:12px;font-size:clamp(14px,2vw,28px);color:var(--sub)}
code{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 .25em}
#bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:15px}
#bar .grow{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#bar .grow i{display:block;height:100%;background:var(--accent);width:0}
button,a.home{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
button.ghost,a.home{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.banner{background:var(--hi);text-align:center;font-size:13px;padding:4px;border-bottom:1px solid var(--line)}
</style></head><body>
<div id="stage"><div class="banner">초안입니다. 강의 전 리허설로 확인 중이며, <b>[확인 필요]</b>·<b>[화면 확인 필요]</b>·<b>[리허설 후 확정]</b> 표시는 수업 전에 채워집니다.</div>
<main id="slide" aria-live="polite"></main>
<div id="bar"><a class="home" href="index.html">처음</a><button class="ghost" id="prev">◀</button><span id="pos"></span><div class="grow"><i id="prog"></i></div><button class="ghost" id="fs">전체화면</button><button id="next">다음 ▶</button></div></div>
<script>
var S=[{"t": "표지", "b": "컴퓨터 기초 + Claude 설치 + 첫 대화"}, {"t": "오늘 끝나면", "b": "내 눈으로 내 가게 이름이 적힌 파일을 열어 본다"}, {"t": "오늘의 순서", "b": "기초 → 인터넷 창 → 가입 → 설치 → 첫 대화"}, {"t": "AI 코딩이란", "b": "말로 시키고, 결과를 내 눈으로 확인한다"}, {"t": "쉬운 말 풀이", "b": "폴더는 서랍, 파일은 서류"}, {"t": "먼저 내 컴퓨터 확인", "b": "윈도 10(1809 이상)·11 또는 맥 13 이상"}, {"t": "윈도에서 확인하기", "b": "설정 → 시스템 → 정보"}, {"t": "맥에서 확인하기", "b": "사과 로고 → 이 Mac에 관하여"}, {"t": "컴퓨터 기초 5가지", "b": "폴더 · 저장 위치 · 확장자 · 복사 · 다운로드"}, {"t": "바탕화면에 폴더 만들기(윈도)", "b": "오른쪽 버튼 → 새로 만들기 → 폴더 → `내가게`"}, {"t": "바탕화면에 폴더 만들기(맥)", "b": "오른쪽 버튼 → 새로운 폴더 → `내가게`"}, {"t": "파일은 저장할 때 위치를 고른다", "b": "저장 창에서 `내가게`를 눈으로 확인"}, {"t": "저장 창 읽는 법", "b": "왼쪽: 바탕화면 · 위쪽: 지금 위치 · 아래: 이름"}, {"t": "파일 이름의 꼬리표", "b": "연습.txt 의 .txt 가 종류 표시"}, {"t": "꼬리표 보이게(윈도)", "b": "보기 → 파일 확장명 체크"}, {"t": "꼬리표 보이게(맥)", "b": "Finder → 설정 → 고급 → 모든 확장자"}, {"t": "복사와 붙여넣기", "b": "윈도 Ctrl+C / Ctrl+V · 맥 command+C / command+V"}, {"t": "다운로드 폴더는 어디", "b": "인터넷에서 받은 파일이 들어오는 서랍"}, {"t": "기초 5가지 점검", "b": "5개 모두 체크했나요"}, {"t": "크롬의 주소창과 탭", "b": "위의 긴 칸 = 주소창, 위의 서류철 = 탭"}, {"t": "안전한 주소 습관", "b": "설치 파일은 알려 드린 주소에서만"}, {"t": "Claude 가입", "b": "내 이메일로 가입, 이메일 확인"}, {"t": "무료와 유료", "b": "무료 플랜에는 Code가 없습니다"}, {"t": "결제는 내가 직접", "b": "강사도 AI도 대신 입력하지 않습니다"}, {"t": "설치 3단계", "b": "받기 → 설치 → 열기"}, {"t": "윈도 설치 화면", "b": "`[화면 캡처 필요]`"}, {"t": "맥 설치 화면", "b": "`[화면 캡처 필요]`"}, {"t": "로그인과 Code 탭", "b": "위쪽 Code 탭을 누릅니다"}, {"t": "`내가게` 폴더 열기", "b": "프로젝트 폴더 메뉴 → Open folder… → 내가게"}, {"t": "권한 모드: Manual", "b": "AI가 바꾸기 전에 나에게 먼저 묻는다"}, {"t": "첫 요청", "b": "이 폴더에 내 가게 이름을 적은 메모 파일을 만들어 줘"}, {"t": "승인 창 읽기", "b": "어느 파일을, 어느 폴더에 만드는지 읽고 허용"}, {"t": "내 눈으로 열어 보기", "b": "Claude 창이 아니라 `내가게` 폴더를 직접 연다"}, {"t": "약속 4가지", "b": "개인정보 · 비밀번호 · 공개 주의 · 직접 확인"}, {"t": "(선택) Codex 비교", "b": "보기만 합니다. 시키는 법과 확인하는 법은 같습니다"}, {"t": "막힐 때 한눈에", "b": "표 + 손 들기"}, {"t": "계정 메모 카드", "b": "가입한 곳, 이메일. 비밀번호는 쓰지 않는다"}, {"t": "숙제와 다음 시간", "b": "앱을 껐다 켜서 `내가게` 다시 열기"}];var N='심화 1회차';var i=0,slide=document.getElementById('slide');
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
function render(){
  var s=S[i],h='<div class="part">'+N+' · '+(i+1)+' / '+S.length+'</div><h1>'+fmt(s.t)+'</h1>';
  var b=s.b||'';
  var m=b.match(/`?\[(?:화면 확인 필요|리허설 후 확정|확인 필요)[^\]]*\]`?/);
  if(m){var rest=b.replace(m[0],'').trim(); if(rest)h+='<div class="big">'+fmt(rest)+'</div>'; h+='<div class="cam">화면 캡처가 들어갑니다 — '+fmt(m[0].replace(/`/g,''))+'</div>'}
  else if(b){h+='<div class="big">'+fmt(b)+'</div>'}
  slide.innerHTML=h;
  document.getElementById('pos').textContent=(i+1)+' / '+S.length;
  document.getElementById('prog').style.width=((i+1)/S.length*100)+'%';
  try{location.hash='#'+(i+1)}catch(e){}
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render()}
document.getElementById('prev').onclick=function(){go(-1)};
document.getElementById('next').onclick=function(){go(1)};
document.getElementById('fs').onclick=function(){var d=document.documentElement;if(document.fullscreenElement){document.exitFullscreen()}else if(d.requestFullscreen){d.requestFullscreen()}};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1)}
  else if(e.key==='f'||e.key==='F'){document.getElementById('fs').click()}
  else if(e.key==='Home'){i=0;render()}else if(e.key==='End'){i=S.length-1;render()}
});
var x0=null;document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(dx<0?1:-1);x0=null},{passive:true});
var h=parseInt((location.hash||'').slice(1),10);if(h>=1&&h<=S.length)i=h-1;
render();
</script></body></html>
