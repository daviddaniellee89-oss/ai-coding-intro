<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI 코딩 입문 특강</title>
<style>
:root{--bg:#faf6ee;--ink:#2b2118;--sub:#6b5d50;--line:#e6dccb;--accent:#a8481f;--accent-ink:#fff;--card:#fff;--warn:#fff2d6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1713;--ink:#f1e8da;--sub:#b9ab99;--line:#3a3128;--accent:#e08a5c;--accent-ink:#1b1713;--card:#26201a;--warn:#3a3020}}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px}
h1{font-size:30px;margin:0 0 6px}
p{color:var(--sub);margin:0 0 24px}
a.btn{display:block;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 0;text-decoration:none;color:var(--ink)}
a.btn b{display:block;font-size:22px;color:var(--accent)}
a.btn span{font-size:16px;color:var(--sub)}
.note{background:var(--warn);border-radius:12px;padding:10px 14px;font-size:15px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<h1>AI 코딩 입문 특강</h1>
<p>코딩 몰라도 됩니다 — AI에게 일 시키는 법</p>
<a class="btn" href="workbook.html"><b>따라하기 워크북</b><span>지시문 복사 버튼 · 체크 표시. 수강생이 수업 중에 열어 둡니다</span></a>
<a class="btn" href="slides.html"><b>강의 슬라이드</b><span>방향키로 넘기기 · N: 강사 메모 · F: 전체화면</span></a>
<div class="note">초안입니다. 리허설 전이라 일부 안내([확인 필요])와 화면 캡처가 비어 있습니다.</div>
</div>
</body>
</html>
